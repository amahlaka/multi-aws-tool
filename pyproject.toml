[project]
name = "multi-aws-tool"
version = "0.2.0"
description = "Multi AWS tool for managing operations across multiple AWS accounts via SSO"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.2",
    "boto3>=1.40",
    "pyyaml>=6.0.2",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/amahlaka/multi-aws-tool"
Repository = "https://github.com/amahlaka/multi-aws-tool"

[project.scripts]
multi-aws = "multi_aws_tool.main:main"
mat-parse = "mat_parse.cli:main"
multi-aws-mcp = "multi_aws_tool.mcp_server:main"


[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"